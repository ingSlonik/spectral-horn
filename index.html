<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta id="vpmeta" name="viewport" content="width=700">
  <title>Spectral Horn - JS13k Optical Puzzle</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body class="is-title">
  <canvas id="c"></canvas>
  <div id="game-header">
    <div class="logo"><span class="logo-icon">✨</span><span class="logo-text"> SPECTRAL HORN</span></div>
    <select id="lvl-select"></select>
    <button id="menu-btn">🏠<span class="btn-text"> Menu</span></button>
    <button id="reset-btn">🔄<span class="btn-text"> Reset</span></button>
    <button id="help-btn">❓<span class="btn-text"> Help</span></button>
    <button id="music-btn">🎵<span class="btn-text"> Music</span></button>
    <button id="sfx-btn">🔊<span class="btn-text"> SFX</span></button>
  </div>
  <div id="game-hint-bar">
    <span id="lvl-title">Level 1</span>
    <span id="lvl-hint">Rotate horn into beam</span>
  </div>
  <div id="title-screen">
    <div class="title-hero">
      <div class="title-main">✨ SPECTRAL HORN ✨</div>
      <div class="title-sub">Updating the laws of optics with crystalline unicorn horns.</div>
    </div>
    <div class="title-action">
      <button id="play-btn" class="btn-play">▶ PLAY</button>
    </div>
    <div class="title-cards" id="title-cards-container"></div>
  </div>
  <div id="help-modal" class="modal hidden">
    <div class="modal-box modal-box-large">
      <div class="modal-title">✨ CONTROLS &amp; OBJECTIVES ✨</div>
      <div class="title-cards" id="modal-cards-container"></div>
      <button id="help-close-btn" class="btn-primary">✕ Got it!</button>
    </div>
  </div>
  <div id="win-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title" id="win-title">✨ LEVEL COMPLETE! ✨</div>
      <p id="win-desc">All spectral sensors are fully charged.</p>
      <button id="next-btn" class="btn-primary">Next Experiment ➔</button>
    </div>
  </div>
  <aside id="author-credit">
    <span>Made by</span>
    <a href="https://paulu.cz/" target="_blank">Filip</a>
  </aside>
  <script type="module" src="./src/game.ts"></script>
</body>

</html>
